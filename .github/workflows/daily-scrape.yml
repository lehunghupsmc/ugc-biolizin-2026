name: Daily UGC Contest Tracker

on:
  schedule:
    - cron: '15 1 */2 * *'       # 08:15 AM VN (01:15 UTC) - Chạy tự động 2 ngày / lần
  workflow_dispatch:
    inputs:
      action:
        description: 'daily = quét hàng ngày | finalize = đóng băng BXH'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - finalize

permissions:
  contents: write
  issues: write

concurrency:
  group: ugc-contest-scrape
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Audit Baseline Check
        run: node scripts/check-audit-baseline.js

      # - name: Run Automated Test Suites
      #   run: npm test

      - name: Execute Scraper & Two-Phase Sheet Sync
        run: node src/index.js --action=${{ github.event.inputs.action || 'daily' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TIKTOK_TOKENS: ${{ secrets.APIFY_TIKTOK_TOKENS }}
          APIFY_FB_TOKENS: ${{ secrets.APIFY_FB_TOKENS }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          GOOGLE_SOURCE_SHEET_ID: ${{ secrets.GOOGLE_SOURCE_SHEET_ID }}
          GOOGLE_INTERNAL_SHEET_ID: ${{ secrets.GOOGLE_INTERNAL_SHEET_ID }}
          GOOGLE_PUBLIC_SHEET_ID: ${{ secrets.GOOGLE_PUBLIC_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Commit & Push Updated BXH Image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bxh-top20.jpg
          git diff --staged --quiet || (git commit -m "Chore: Auto-update Leaderboard Image [skip ci]" && git push)
