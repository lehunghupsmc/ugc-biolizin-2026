name: Check Source Sheet (Read-Only)

on:
  workflow_dispatch:

jobs:
  check-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inspect Source Sheet Column Q (No Scraping)
        run: node scripts/check-source-sheet.js
        env:
          GOOGLE_SOURCE_SHEET_ID: ${{ secrets.GOOGLE_SOURCE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
